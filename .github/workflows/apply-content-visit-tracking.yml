name: Apply content visit tracking

on:
  push:
    branches:
      - feature/content-attribution-v1
    paths:
      - .github/workflows/apply-content-visit-tracking.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/content-attribution-v1
          fetch-depth: 0

      - name: Patch click tracking
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          code_path = 'backend/Code.gs'
          frontend_path = '_includes/v3-08.html'
          readme_path = 'README.md'

          replace_once(
              code_path,
              "const ATTRIBUTION_CHANNELS_ = ['telegram', 'instagram', 'vk', 'direct'];\n",
              "const ATTRIBUTION_CHANNELS_ = ['telegram', 'instagram', 'vk', 'direct'];\n"
              "const CONTENT_VISIT_SPREADSHEET_PROPERTY_ = 'CONTENT_VISIT_SPREADSHEET_ID';\n"
              "const CONTENT_VISIT_SHEET_NAME_ = 'Visits';\n"
              "const CONTENT_VISIT_HEADERS_ = [\n"
              "  'Получено (JST)',\n"
              "  'Время клиента',\n"
              "  'Event ID',\n"
              "  'ID контента',\n"
              "  'Канал',\n"
              "  'Тур',\n"
              "  'URL страницы',\n"
              "  'Referrer',\n"
              "  'Устройство',\n"
              "  'Платформа',\n"
              "  'User-Agent',\n"
              "  'Язык',\n"
              "  'Экран',\n"
              "  'Окно',\n"
              "  'Часовой пояс'\n"
              "];\n"
          )

          setup_block = r'''function SETUP_CONTENT_VISIT_LOG() {
  const props = PropertiesService.getScriptProperties();
  const existingId = safeText_(props.getProperty(CONTENT_VISIT_SPREADSHEET_PROPERTY_));
  let spreadsheet = null;

  if (existingId) {
    try {
      spreadsheet = SpreadsheetApp.openById(existingId);
    } catch (err) {
      spreadsheet = null;
    }
  }

  if (!spreadsheet) {
    spreadsheet = SpreadsheetApp.create('SamuRay Tours - переходы по контенту');
    props.setProperty(CONTENT_VISIT_SPREADSHEET_PROPERTY_, spreadsheet.getId());
  }

  try {
    spreadsheet.setSpreadsheetTimeZone('Asia/Tokyo');
  } catch (err) {
    // The spreadsheet still works if the timezone cannot be changed.
  }

  const sheet = ensureContentVisitSheet_(spreadsheet);
  const result = {
    ok: true,
    spreadsheetId: spreadsheet.getId(),
    spreadsheetUrl: spreadsheet.getUrl(),
    sheetName: sheet.getName(),
  };
  console.log(JSON.stringify(result, null, 2));
  return result;
}

function TEST_CONTENT_VISIT_LOG() {
  const setup = SETUP_CONTENT_VISIT_LOG();
  const result = handleContentVisit_({
    eventType: 'content_visit',
    eventId: 'manual-' + Utilities.getUuid(),
    contentId: 311,
    channel: 'telegram',
    tour: '',
    pageUrl: 'https://samuray-games.github.io/samuray-tours/?content=311&channel=telegram',
    referrer: 'manual-apps-script-test',
    device: 'Apps Script test',
    platform: 'Google Apps Script',
    userAgent: 'TEST_CONTENT_VISIT_LOG',
    language: 'ru',
    screen: '',
    viewport: '',
    clientTimezone: 'Asia/Tokyo',
    clientTimestamp: new Date().toISOString(),
  });
  result.spreadsheetUrl = setup.spreadsheetUrl;
  console.log(JSON.stringify(result, null, 2));
  return result;
}

function TEST_CONTENT_VISIT_RECENT() {
  const spreadsheet = getContentVisitSpreadsheet_();
  const sheet = ensureContentVisitSheet_(spreadsheet);
  const lastRow = sheet.getLastRow();
  if (lastRow <= 1) {
    const empty = { ok: true, count: 0, rows: [], spreadsheetUrl: spreadsheet.getUrl() };
    console.log(JSON.stringify(empty, null, 2));
    return empty;
  }
  const count = Math.min(10, lastRow - 1);
  const rows = sheet.getRange(lastRow - count + 1, 1, count, CONTENT_VISIT_HEADERS_.length).getDisplayValues();
  const result = { ok: true, count: count, rows: rows, spreadsheetUrl: spreadsheet.getUrl() };
  console.log(JSON.stringify(result, null, 2));
  return result;
}

'''
          replace_once(code_path, 'function doPost(e) {\n', setup_block + 'function doPost(e) {\n')

          replace_once(
              code_path,
              "    const payload = parsePayload_(e);\n    validatePayload_(payload);\n",
              "    const payload = parsePayload_(e);\n"
              "    if (safeText_(payload.eventType) === 'content_visit') {\n"
              "      return jsonResponse_(handleContentVisit_(payload));\n"
              "    }\n"
              "    validatePayload_(payload);\n"
          )

          helper_block = r'''function handleContentVisit_(payload) {
  const p = payload || {};
  const eventId = safeText_(p.eventId) || Utilities.getUuid();
  const contentId = positiveIntegerOrNull_(p.contentId);
  const channel = normalizeContentVisitChannel_(p.channel);
  const cache = CacheService.getScriptCache();
  const cacheKey = 'content-visit:' + eventId;

  if (cache.get(cacheKey)) {
    return { ok: true, duplicate: true, eventId: eventId };
  }

  cache.put(cacheKey, '1', 21600);
  const lock = LockService.getScriptLock();
  lock.waitLock(5000);
  try {
    const spreadsheet = getContentVisitSpreadsheet_();
    const sheet = ensureContentVisitSheet_(spreadsheet);
    sheet.appendRow([
      new Date(),
      safeText_(p.clientTimestamp),
      eventId,
      contentId || '',
      channel,
      safeText_(p.tour),
      safeText_(p.pageUrl).slice(0, 2000),
      safeText_(p.referrer).slice(0, 2000),
      safeText_(p.device).slice(0, 120),
      safeText_(p.platform).slice(0, 200),
      safeText_(p.userAgent).slice(0, 500),
      safeText_(p.language).slice(0, 50),
      safeText_(p.screen).slice(0, 50),
      safeText_(p.viewport).slice(0, 50),
      safeText_(p.clientTimezone).slice(0, 100),
    ]);
    return {
      ok: true,
      duplicate: false,
      eventId: eventId,
      contentId: contentId,
      channel: channel,
    };
  } catch (err) {
    cache.remove(cacheKey);
    throw err;
  } finally {
    lock.releaseLock();
  }
}

function getContentVisitSpreadsheet_() {
  const id = safeText_(PropertiesService.getScriptProperties().getProperty(CONTENT_VISIT_SPREADSHEET_PROPERTY_));
  if (!id) {
    throw new Error('Run SETUP_CONTENT_VISIT_LOG once before collecting visits');
  }
  return SpreadsheetApp.openById(id);
}

function ensureContentVisitSheet_(spreadsheet) {
  let sheet = spreadsheet.getSheetByName(CONTENT_VISIT_SHEET_NAME_);
  if (!sheet) {
    const sheets = spreadsheet.getSheets();
    if (sheets.length === 1 && sheets[0].getLastRow() === 0) {
      sheet = sheets[0];
      sheet.setName(CONTENT_VISIT_SHEET_NAME_);
    } else {
      sheet = spreadsheet.insertSheet(CONTENT_VISIT_SHEET_NAME_);
    }
  }

  const headerRange = sheet.getRange(1, 1, 1, CONTENT_VISIT_HEADERS_.length);
  const currentHeaders = headerRange.getDisplayValues()[0];
  let needsHeaders = false;
  for (let i = 0; i < CONTENT_VISIT_HEADERS_.length; i++) {
    if (currentHeaders[i] !== CONTENT_VISIT_HEADERS_[i]) {
      needsHeaders = true;
      break;
    }
  }
  if (needsHeaders) {
    headerRange.setValues([CONTENT_VISIT_HEADERS_]);
  }
  headerRange.setFontWeight('bold');
  sheet.setFrozenRows(1);
  return sheet;
}

function normalizeContentVisitChannel_(value) {
  const normalized = safeText_(value).toLowerCase();
  return ATTRIBUTION_CHANNELS_.indexOf(normalized) !== -1 ? normalized : 'direct';
}

function positiveIntegerOrNull_(value) {
  const text = safeText_(value);
  if (!/^\d+$/.test(text)) return null;
  const number = parseInt(text, 10);
  return Number.isFinite(number) && number > 0 ? number : null;
}

'''
          replace_once(code_path, 'function parsePayload_(e) {\n', helper_block + 'function parsePayload_(e) {\n')

          frontend_block = r''' var contentVisitSent=false;

 function makeContentVisitId(){
  try{
   if(window.crypto && typeof window.crypto.randomUUID==="function"){return window.crypto.randomUUID();}
  }catch(error){}
  return "visit-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12);
 }

 function normalizeVisitChannel(value){
  var channel=String(value||"").toLowerCase();
  return ["telegram","instagram","vk","direct"].indexOf(channel)!==-1 ? channel : "direct";
 }

 function detectVisitDevice(){
  var ua=String(navigator.userAgent||"");
  if(/iPad|Tablet/i.test(ua)){return "tablet";}
  if(/iPhone|iPod|Android|Mobile/i.test(ua)){return "mobile";}
  return "desktop";
 }

 function trackContentVisit(){
  if(contentVisitSent){return;}
  var params;
  try{params=new URLSearchParams(location.search||"");}catch(error){return;}
  var rawContent=String(params.get("content")||"").trim();
  var rawChannel=String(params.get("channel")||"").trim();
  if(!rawContent && !rawChannel){return;}
  var contentId=/^\d+$/.test(rawContent) && parseInt(rawContent,10)>0 ? parseInt(rawContent,10) : null;
  contentVisitSent=true;
  var payload={
   eventType:"content_visit",
   eventId:makeContentVisitId(),
   contentId:contentId,
   channel:normalizeVisitChannel(rawChannel),
   tour:String(params.get("tour")||""),
   pageUrl:location.href,
   referrer:document.referrer||"",
   device:detectVisitDevice(),
   platform:String(navigator.platform||""),
   userAgent:String(navigator.userAgent||""),
   language:String(navigator.language||""),
   screen:window.screen ? String(window.screen.width)+"x"+String(window.screen.height) : "",
   viewport:String(window.innerWidth||"")+"x"+String(window.innerHeight||""),
   clientTimezone:(function(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(error){return "";}})(),
   clientTimestamp:new Date().toISOString()
  };
  try{
   fetch(endpoint,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload),
    mode:"no-cors",
    keepalive:true,
    redirect:"follow"
   }).catch(function(){});
  }catch(error){}
 }

'''
          replace_once(frontend_path, ' var applyFormTemplate=null;\n', ' var applyFormTemplate=null;\n' + frontend_block)
          replace_once(
              frontend_path,
              ' captureApplyTemplate();\n  bindApplyForm();\n })();',
              ' captureApplyTemplate();\n  bindApplyForm();\n  trackContentVisit();\n })();'
          )

          readme_append = r'''

## Учёт переходов по контентным ссылкам

При открытии каталога с параметром `content` или `channel` frontend отправляет событие `content_visit` в тот же Apps Script Web App.

Событие сохраняет:

- серверное и клиентское время;
- `eventId`;
- `ID контента` и канал;
- выбранный `tour`, если он есть;
- URL и referrer;
- тип устройства, платформу, User-Agent, язык, размер экрана и часовой пояс.

IP-адреса и cookies не собираются.

Перед первым использованием в Google Apps Script один раз запустить:

- `SETUP_CONTENT_VISIT_LOG`

Функция создаст Google-таблицу `SamuRay Tours - переходы по контенту` и сохранит её ID в Script Property `CONTENT_VISIT_SPREADSHEET_ID`.

Проверки:

- `TEST_CONTENT_VISIT_LOG` - добавляет одну тестовую строку;
- `TEST_CONTENT_VISIT_RECENT` - показывает последние 10 строк и URL таблицы.
'''
          readme = Path(readme_path)
          text = readme.read_text(encoding='utf-8')
          if '## Учёт переходов по контентным ссылкам' not in text:
              readme.write_text(text.rstrip() + readme_append + '\n', encoding='utf-8')
          PY

      - name: Validate syntax
        shell: bash
        run: |
          cp backend/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('_includes/v3-08.html').read_text(encoding='utf-8')
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/frontend.js').write_text(text[start:end], encoding='utf-8')
          PY
          node --check /tmp/frontend.js

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-content-visit-tracking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs _includes/v3-08.html README.md .github/workflows/apply-content-visit-tracking.yml
          git commit -m "Track content link visits"
          git push origin HEAD:feature/content-attribution-v1
