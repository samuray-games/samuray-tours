name: Patch Telegram post ID tracking

on:
  push:
    branches:
      - feature/content-attribution-v1
    paths:
      - .github/workflows/patch-telegram-post-id.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/content-attribution-v1
          fetch-depth: 0

      - name: Patch tracking files
        shell: python
        run: |
          from pathlib import Path

          frontend = Path('_includes/v3-10-content-visits.html')
          text = frontend.read_text()
          text = text.replace(
              '  var rawChannel=String(params.get("channel")||"").trim();\n  var validContent=/^\\d+$/.test(rawContent) && parseInt(rawContent,10)>0;',
              '  var rawChannel=String(params.get("channel")||"").trim();\n  var rawPost=String(params.get("post")||"").trim();\n  var validContent=/^\\d+$/.test(rawContent) && parseInt(rawContent,10)>0;\n  var validPost=/^\\d+$/.test(rawPost) && parseInt(rawPost,10)>0;'
          )
          text = text.replace(
              '   channel:normalizeChannel(rawChannel),\n   tour:String(params.get("tour")||""),',
              '   channel:normalizeChannel(rawChannel),\n   post:validPost ? String(parseInt(rawPost,10)) : "",\n   publicationUrl:(validPost && normalizeChannel(rawChannel)==="telegram") ? "https://t.me/samuray_tours/"+String(parseInt(rawPost,10)) : "",\n   tour:String(params.get("tour")||""),'
          )
          frontend.write_text(text)

          backend = Path('backend/zz_ContentVisitTracking.gs')
          text = backend.read_text()
          text = text.replace(
              "  const result = inspectContentVisitMetric_({\n    content: 311,\n    channel: 'telegram',\n  });",
              "  const result = inspectContentVisitMetric_({\n    post: 135,\n    channel: 'telegram',\n  });"
          )
          text = text.replace(
              "    content: 311,\n    channel: 'telegram',\n    tour: '',\n    pageUrl: 'https://samuray-games.github.io/samuray-tours/?content=311&channel=telegram',",
              "    content: '',\n    channel: 'telegram',\n    post: 135,\n    publicationUrl: 'https://t.me/samuray_tours/135',\n    tour: '',\n    pageUrl: 'https://samuray-games.github.io/samuray-tours/?channel=telegram&post=135',"
          )
          text = text.replace(
              "  const contentId = contentVisitPositiveInteger_(params && params.content);\n  const device = normalizeContentVisitDevice_(params && params.device);\n  const date = Utilities.formatDate(new Date(), CONTENT_VISIT_TIMEZONE_, 'yyyy-MM-dd');\n  const metricTitle = buildContentVisitMetricTitle_(contentId, channelLabel, date);",
              "  const contentId = contentVisitPositiveInteger_(params && params.content);\n  const postId = contentVisitPositiveInteger_(params && params.post);\n  const publicationUrl = normalizeContentVisitPublicationUrl_(params, channel, postId);\n  const device = normalizeContentVisitDevice_(params && params.device);\n  const date = Utilities.formatDate(new Date(), CONTENT_VISIT_TIMEZONE_, 'yyyy-MM-dd');\n  const metricTitle = buildContentVisitMetricTitle_(contentId, postId, channelLabel, date);"
          )
          text = text.replace(
              "      const properties = {\n        'Переходы': { number: total },\n        'Последний переход': { date: { start: new Date().toISOString() } },\n        'Последнее устройство': contentVisitRichText_(deviceDescription),\n      };",
              "      const properties = {\n        'Переходы': { number: total },\n        'Последний переход': { date: { start: new Date().toISOString() } },\n        'Последнее устройство': contentVisitRichText_(deviceDescription),\n      };\n      if (postId) properties['Номер публикации'] = { number: postId };\n      if (publicationUrl) properties['Ссылка публикации'] = { url: publicationUrl };"
          )
          text = text.replace(
              "        'Последнее устройство': contentVisitRichText_(deviceDescription),\n      };\n      if (contentPage && contentPage.id) {",
              "        'Последнее устройство': contentVisitRichText_(deviceDescription),\n      };\n      if (postId) properties['Номер публикации'] = { number: postId };\n      if (publicationUrl) properties['Ссылка публикации'] = { url: publicationUrl };\n      if (contentPage && contentPage.id) {"
          )
          text = text.replace(
              "      contentId: contentId,\n      channel: channel,",
              "      contentId: contentId,\n      postId: postId,\n      publicationUrl: publicationUrl || null,\n      channel: channel,"
          )
          text = text.replace(
              "  const contentId = contentVisitPositiveInteger_(params && params.content);\n  const date = Utilities.formatDate(new Date(), CONTENT_VISIT_TIMEZONE_, 'yyyy-MM-dd');\n  const metricTitle = buildContentVisitMetricTitle_(contentId, channelLabel, date);",
              "  const contentId = contentVisitPositiveInteger_(params && params.content);\n  const postId = contentVisitPositiveInteger_(params && params.post);\n  const date = Utilities.formatDate(new Date(), CONTENT_VISIT_TIMEZONE_, 'yyyy-MM-dd');\n  const metricTitle = buildContentVisitMetricTitle_(contentId, postId, channelLabel, date);"
          )
          text = text.replace(
              "function buildContentVisitMetricTitle_(contentId, channelLabel, date) {\n  const subject = contentId ? 'CT-' + contentId : 'BIO';\n  return subject + ' - ' + channelLabel + ' - ' + date;\n}",
              "function buildContentVisitMetricTitle_(contentId, postId, channelLabel, date) {\n  const subjects = [];\n  if (postId && channelLabel === 'Telegram') subjects.push('TG-' + postId);\n  if (contentId) subjects.push('CT-' + contentId);\n  if (!subjects.length) subjects.push('BIO');\n  return subjects.join(' / ') + ' - ' + channelLabel + ' - ' + date;\n}\n\nfunction normalizeContentVisitPublicationUrl_(params, channel, postId) {\n  const explicit = contentVisitText_(params && params.publicationUrl);\n  if (/^https?:\\/\\//i.test(explicit)) return explicit.slice(0, 2000);\n  if (channel === 'telegram' && postId) return 'https://t.me/samuray_tours/' + postId;\n  return '';\n}"
          )
          backend.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'Frontend-файл `_includes/v3-10-content-visits.html` отправляет событие `content_visit` при открытии каталога с параметром `content` или `channel`.',
              'Frontend-файл `_includes/v3-10-content-visits.html` отправляет событие `content_visit` при открытии каталога с параметром `content`, `channel` или `post`.'
          )
          text = text.replace(
              '`CT-311 - Telegram - 2026-07-30`',
              '`TG-135 / CT-311 - Telegram - 2026-07-30`'
          )
          text = text.replace(
              '- `Последнее устройство`',
              '- `Последнее устройство`\n- `Номер публикации`\n- `Ссылка публикации`'
          )
          text = text.replace(
              'Для ссылок из био без `content` используется дневная строка вида:',
              'Для Telegram-поста добавляется `post`, например `?content=311&channel=telegram&post=135`. `content` остаётся ID карточки Notion, а `post` является номером сообщения Telegram.\n\nДля ссылок из био без `content` и `post` используется дневная строка вида:'
          )
          readme.write_text(text)

      - name: Validate JavaScript syntax
        run: |
          cp backend/zz_ContentVisitTracking.gs /tmp/content-visits.js
          node --check /tmp/content-visits.js
          sed -n '/<script>/,/<\/script>/p' _includes/v3-10-content-visits.html | sed '1d;$d' > /tmp/content-visits-front.js
          node --check /tmp/content-visits-front.js

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/zz_ContentVisitTracking.gs _includes/v3-10-content-visits.html README.md
          git commit -m "fix: track Telegram post number separately"
          git rm .github/workflows/patch-telegram-post-id.yml
          git commit -m "chore: remove one-off post tracking workflow"
          git push origin feature/content-attribution-v1
