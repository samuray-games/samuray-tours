name: Vendor tour photography
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-tour-photos.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet Pillow requests
      - name: Download and optimize licensed location photos
        run: python scripts/fetch_tour_photos.py
      - name: Commit optimized web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tour-photos/*.webp
          if git diff --cached --quiet; then
            echo 'Photos already current'
          else
            git commit -m 'Add optimized tour location photography'
            git push
          fi
