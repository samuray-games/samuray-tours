name: Patch content click tracking

on:
  push:
    branches:
      - feature/content-click-tracking-v1
    paths:
      - .github/workflows/patch-content-click-tracking.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tracking-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/content-click-tracking-v1
          fetch-depth: 0

      - name: Route click events through doGet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/Code.gs')
          text = path.read_text(encoding='utf-8')
          old = """function doGet() {
            return jsonResponse_({ ok: true, service: 'SamuRay Tours applications' });
          }
          """
          new = """function doGet(e) {
            const params = e && e.parameter ? e.parameter : {};
            if (String(params.eventType || '').trim() === 'content_visit') {
              return handleContentVisitGet_(e);
            }
            return jsonResponse_({ ok: true, service: 'SamuRay Tours applications' });
          }
          """
          if old not in text:
              raise SystemExit('Expected doGet block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check backend/Code.gs
          node --check backend/ContentVisitTracking.gs

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs
          git commit -m "Route content click events [tracking-patch]"
          git rm .github/workflows/patch-content-click-tracking.yml
          git commit -m "Remove temporary tracking workflow [tracking-patch]"
          git push origin HEAD:feature/content-click-tracking-v1
