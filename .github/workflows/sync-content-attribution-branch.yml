name: Sync content attribution branch

on:
  push:
    branches:
      - feature/content-attribution-v1
    paths:
      - .github/workflows/sync-content-attribution-branch.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/content-attribution-v1
          fetch-depth: 0

      - name: Merge current main and verify backend
        shell: bash
        run: |
          git config user.name "SamuRay Tours automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          cp backend/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git rm .github/workflows/sync-content-attribution-branch.yml
          git commit -m "Remove one-time branch sync workflow"
          git push origin HEAD:feature/content-attribution-v1
