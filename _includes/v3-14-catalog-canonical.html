 var grid=document.getElementById("grid");
 var modal=document.getElementById("modal");
 var modalContent=document.getElementById("modalContent");
 var currentId=new URL(window.location.href).searchParams.get("tour")||null;
 var patching=false;
 var gridObserver=null;
 var modalObserver=null;

 function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(c){
   return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
 }
 function idFromCard(card){
  if(!card){return null;}
  var direct=card.getAttribute("data-catalog25-card")||card.getAttribute("data-tour-id");
  if(direct){return direct;}
  var button=card.querySelector("[data-fallback-detail],[data-catalog25-detail],[onclick*='openTour'],[onclick*=\"openTour\"]");
  if(!button){return null;}
  var id=button.getAttribute("data-fallback-detail")||button.getAttribute("data-catalog25-detail");
  if(id){return id;}
  var onclick=button.getAttribute("onclick")||"";
  var match=onclick.match(/openTour\(\s*['\"]([^'\"]+)['\"]\s*\)/);
  return match?match[1]:null;
 }
 function findAttrTarget(node,names){
  while(node && node!==document){
   if(node.getAttribute){
    for(var i=0;i<names.length;i++){
     var value=node.getAttribute(names[i]);
     if(value){return {node:node,id:value};}
    }
   }
   node=node.parentNode;
  }
  return null;
 }
 function titleTspans(t){
  var lines=t.coverLines||[t.title];
  var start=710-(lines.length-1)*62;
  var html="";
  for(var i=0;i<lines.length;i++){
   html+='<tspan x="58" y="'+(start+i*68)+'">'+esc(lines[i])+'</tspan>';
  }
  return html;
 }
 function coverSvg(id,t){
  var gid="tour-gradient-"+id;
  return '<svg class="tour-cover" viewBox="0 0 750 1000" role="img" aria-label="'+esc(t.title)+'">'+
   '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">'+
   '<stop offset="0" stop-color="'+esc(t.colors[0])+'"/><stop offset="1" stop-color="'+esc(t.colors[1])+'"/></linearGradient></defs>'+
   '<rect width="750" height="1000" rx="34" fill="url(#'+gid+')"/>'+
   '<circle cx="600" cy="180" r="210" fill="#fff" opacity=".10"/>'+
   '<circle cx="598" cy="180" r="152" fill="none" stroke="#fff" stroke-width="2" opacity=".20"/>'+
   '<path d="M-40 410 L790 110 M-20 520 L790 220" fill="none" stroke="#fff" stroke-width="3" opacity=".10"/>'+
   '<text x="56" y="78" fill="#fff" opacity=".78" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="700" letter-spacing="5">SAMURAY TOURS</text>'+
   '<text x="72" y="430" fill="#fff" opacity=".16" font-family="Hiragino Sans,Yu Gothic,system-ui,sans-serif" font-size="255" font-weight="800">'+esc(t.mark)+'</text>'+
   '<rect x="56" y="614" width="112" height="6" rx="3" fill="#fff" opacity=".82"/>'+
   '<text fill="#fff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="54" font-weight="850" letter-spacing="-1">'+titleTspans(t)+'</text>'+
   '<text x="58" y="930" fill="#fff" opacity=".72" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="650" letter-spacing="3">PRIVATE WALK • TOKYO</text>'+
  '</svg>';
 }
 function patchCard(card){
  var id=idFromCard(card);
  var t=DATA[id];
  if(!id || !t){return;}
  card.setAttribute("data-tour-id",id);
  var title=card.querySelector("h3");
  if(title){title.textContent=t.title;}
  var desc=card.querySelector(".desc");
  if(desc){
   var intro=card.querySelector(".tour-intro");
   if(!intro){
    intro=document.createElement("div");
    intro.className="tour-intro";
    desc.parentNode.insertBefore(intro,desc);
    intro.appendChild(desc);
   }
   var old=intro.querySelector(".tour-cover");
   if(!old){
    intro.insertAdjacentHTML("afterbegin",coverSvg(id,t));
   }
  }
  var meta=card.querySelectorAll(".meta span");
  if(meta[0]){meta[0].textContent=t.duration;}
  if(meta[1]){meta[1].textContent=t.badge;}
  var price=card.querySelector(".price");
  if(price){price.textContent=t.cardPrice;}
 }
 function patchCards(){
  if(!grid || patching){return;}
  patching=true;
  if(gridObserver){gridObserver.disconnect();}
  try{
   var cards=grid.querySelectorAll(".card");
   for(var i=0;i<cards.length;i++){patchCard(cards[i]);}
  }finally{
   if(gridObserver){gridObserver.observe(grid,{childList:true});}
   patching=false;
  }
 }
 function replaceExpressNames(root){
  if(!root){return;}
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  var node;
  while((node=walker.nextNode())){
   if(node.nodeValue.indexOf("Токио Экспресс")!==-1 || node.nodeValue.indexOf('Экспресс "Всё за день"')!==-1){
    node.nodeValue=node.nodeValue
     .replace(/Токио Экспресс/g,"Всё за день!")
     .replace(/Экспресс "Всё за день"/g,"Всё за день!");
   }
  }
 }
 function patchModal(id){
  var t=DATA[id];
  if(!t || !modalContent){return;}
  var h2=modalContent.querySelector("h2");
  if(h2){h2.textContent=t.title;}
  var infos=modalContent.querySelectorAll(".info");
  for(var i=0;i<infos.length;i++){
   var small=infos[i].querySelector("small");
   var bold=infos[i].querySelector("b");
   if(!small||!bold){continue;}
   if(small.textContent.trim()==="Длительность"){bold.textContent=t.duration;}
   if(small.textContent.trim()==="Стоимость"){bold.textContent=t.fullPrice;}
  }
  if(id==="express"){replaceExpressNames(modalContent);}
 }
 function patchApply(id){
  var t=DATA[id];
  if(!t){return;}
  var values={
   tourId:id,
   tourTitle:t.title,
   tourPrice:t.fullPrice,
   selectedTourBadge:t.title,
   summaryTour:t.title,
   summaryPrice:t.fullPrice
  };
  Object.keys(values).forEach(function(key){
   var el=document.getElementById(key);
   if(!el){return;}
   if("value" in el && (key==="tourId"||key==="tourTitle"||key==="tourPrice")){el.value=values[key];}
   else{el.textContent=values[key];}
  });
 }
 function scheduleDetail(id){
  if(id){currentId=id;}
  [0,40,120,280].forEach(function(delay){
   setTimeout(function(){
    patchModal(currentId);
    patchApply(currentId);
   },delay);
  });
 }

 window.addEventListener("click",function(event){
  var detail=findAttrTarget(event.target,["data-fallback-detail","data-catalog25-detail"]);
  if(detail){currentId=detail.id;scheduleDetail(detail.id);return;}
  var apply=findAttrTarget(event.target,["data-fallback-apply","data-catalog25-apply","data-detail-apply"]);
  if(apply){
   var id=apply.id||currentId;
   if(id){currentId=id;scheduleDetail(id);}
   return;
  }
  var node=event.target;
  while(node && node!==document){
   if(node.getAttribute){
    var onclick=node.getAttribute("onclick")||"";
    var detailMatch=onclick.match(/openTour\(\s*['\"]([^'\"]+)['\"]\s*\)/);
    var applyMatch=onclick.match(/openApply\(\s*['\"]([^'\"]+)['\"]\s*\)/);
    if(detailMatch){currentId=detailMatch[1];scheduleDetail(currentId);return;}
    if(applyMatch){currentId=applyMatch[1];scheduleDetail(currentId);return;}
   }
   node=node.parentNode;
  }
 },true);

 if(grid){
  gridObserver=new MutationObserver(function(){setTimeout(patchCards,0);});
  gridObserver.observe(grid,{childList:true});
 }
 if(modalContent){
  modalObserver=new MutationObserver(function(){scheduleDetail(currentId||new URL(window.location.href).searchParams.get("tour"));});
  modalObserver.observe(modalContent,{childList:true,subtree:true});
 }
 window.addEventListener("popstate",function(){
  currentId=new URL(window.location.href).searchParams.get("tour")||null;
  scheduleDetail(currentId);
 });
 patchCards();
 setTimeout(patchCards,120);
 setTimeout(patchCards,500);
 setTimeout(function(){
  currentId=currentId||new URL(window.location.href).searchParams.get("tour");
  scheduleDetail(currentId);
 },650);
 window.SAMURAY_TOUR_CATALOG=DATA;
})();
</script>
