<script>
(function(){
 var endpoint="https://script.google.com/macros/s/AKfycbztCYRPUfjdHesTP0hDl9WEwP_Uapj31sLkYH8mO89qvREswQ_5n5Ccv8rP2he66bPiHA/exec";

 function makeEventId(){
  try{
   if(window.crypto && typeof window.crypto.randomUUID==="function"){
    return window.crypto.randomUUID();
   }
  }catch(error){}
  return "visit-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12);
 }

 function normalizeChannel(value){
  var channel=String(value||"").trim().toLowerCase();
  return ["telegram","instagram","vk","direct"].indexOf(channel)!==-1 ? channel : "direct";
 }

 function detectDevice(){
  var ua=String(navigator.userAgent||"");
  if(/iPad|Tablet/i.test(ua)){return "tablet";}
  if(/iPhone|iPod|Android|Mobile/i.test(ua)){return "mobile";}
  return "desktop";
 }

 function trackContentVisit(){
  var params;
  try{
   params=new URLSearchParams(location.search||"");
  }catch(error){
   return;
  }

  var rawContent=String(params.get("content")||"").trim();
  var rawChannel=String(params.get("channel")||"").trim();
  var validContent=/^\d+$/.test(rawContent) && parseInt(rawContent,10)>0;
  if(!validContent && !rawChannel){return;}

  var payload={
   eventType:"content_visit",
   eventId:makeEventId(),
   content:validContent ? String(parseInt(rawContent,10)) : "",
   channel:normalizeChannel(rawChannel),
   tour:String(params.get("tour")||""),
   pageUrl:location.href,
   referrer:document.referrer||"",
   device:detectDevice(),
   platform:String(navigator.platform||""),
   userAgent:String(navigator.userAgent||""),
   language:String(navigator.language||""),
   screen:window.screen ? String(window.screen.width)+"x"+String(window.screen.height) : "",
   viewport:String(window.innerWidth||"")+"x"+String(window.innerHeight||""),
   clientTimezone:(function(){
    try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"";}
    catch(error){return "";}
   })(),
   clientTimestamp:new Date().toISOString()
  };

  var query=[];
  Object.keys(payload).forEach(function(key){
   query.push(encodeURIComponent(key)+"="+encodeURIComponent(payload[key]));
  });

  try{
   fetch(endpoint+"?"+query.join("&"),{
    method:"GET",
    mode:"no-cors",
    credentials:"omit",
    cache:"no-store",
    keepalive:true,
    redirect:"follow"
   }).catch(function(){});
  }catch(error){}
 }

 trackContentVisit();
})();
</script>
