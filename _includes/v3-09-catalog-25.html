 var applying=false;
 var observer=null;

 function esc(value){
  return String(value||"").replace(/[&<>\"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[c];});
 }

 function findAttrTarget(start,attr){
  var node=start;
  while(node && node!==document){
   if(node.getAttribute && node.getAttribute(attr)!==null){return node;}
   node=node.parentNode;
  }
  return null;
 }

 function findCard(id){
  var buttons=grid.querySelectorAll("[data-fallback-detail],[data-catalog25-detail]");
  for(var i=0;i<buttons.length;i++){
   var buttonId=buttons[i].getAttribute("data-fallback-detail")||buttons[i].getAttribute("data-catalog25-detail");
   if(buttonId===id){
    var node=buttons[i];
    while(node && node!==grid){
     if(node.classList && node.classList.contains("card")){return node;}
     node=node.parentNode;
    }
   }
  }
  return null;
 }

 function currentFilter(){
  var active=document.querySelector("[data-fallback-filter].active");
  return active ? active.getAttribute("data-fallback-filter") : "all";
 }

 function matchesFilter(t,filter){
  return filter==="all" || t.tags.indexOf(filter)!==-1;
 }

 function buildCard(t){
  var points="";
  for(var i=0;i<t.points.length;i++){points+="<li>"+esc(t.points[i])+"</li>";}
  var wrapper=document.createElement("div");
  wrapper.innerHTML=
   "<article class=\"card\" data-catalog25-card=\""+esc(t.id)+"\">"+
    "<h3>"+esc(t.title)+"</h3>"+
    "<p class=\"desc\">"+esc(t.desc)+"</p>"+
    "<ul class=\"points\">"+points+"</ul>"+
    "<div class=\"meta\"><span>"+esc(t.duration)+"</span><span>"+esc(t.format)+"</span></div>"+
    "<div class=\"price\">"+esc(t.price)+"</div>"+
    "<div class=\"card-actions\"><button class=\"btn btn-secondary\" type=\"button\" data-catalog25-detail=\""+esc(t.id)+"\">Подробнее</button>"+
    "<button class=\"btn btn-primary\" type=\"button\" data-catalog25-apply=\""+esc(t.id)+"\">Оставить заявку</button></div>"+
   "</article>";
  return wrapper.firstElementChild;
 }

 function insertSeasonal(filter){
  var reference=findCard("shinjuku");
  for(var i=0;i<4;i++){
   var t=managedTours[i];
   if(!matchesFilter(t,filter)){continue;}
   var card=buildCard(t);
   if(reference){grid.insertBefore(card,reference);}else{grid.appendChild(card);}
  }
 }

 function insertKaraoke(filter){
  var t=managedTours[4];
  if(!matchesFilter(t,filter)){return;}
  var shinjuku=findCard("shinjuku");
  var card=buildCard(t);
  if(shinjuku && shinjuku.nextSibling){grid.insertBefore(card,shinjuku.nextSibling);}
  else if(shinjuku){grid.appendChild(card);}
  else{grid.appendChild(card);}
 }

 function insertExcursions(filter){
  var anchor=findCard("odaiba");
  for(var i=5;i<managedTours.length;i++){
   var t=managedTours[i];
   if(!matchesFilter(t,filter)){continue;}
   var card=buildCard(t);
   if(anchor && anchor.nextSibling){grid.insertBefore(card,anchor.nextSibling);}
   else{grid.appendChild(card);}
   anchor=card;
  }
 }

 function updateCount(){
  var count=document.getElementById("count");
  if(!count){return;}
  var total=grid.querySelectorAll(".card").length;
  count.textContent=total+" "+(total===1?"маршрут":"маршрутов");
 }

 function patchGrid(){
  if(applying){return;}
  applying=true;
  if(observer){observer.disconnect();}
  try{
   var custom=grid.querySelectorAll("[data-catalog25-card]");
   for(var i=0;i<custom.length;i++){custom[i].remove();}
   var legacy=findCard("season");
   if(legacy){legacy.remove();}
   var filter=currentFilter();
   insertSeasonal(filter);
   insertKaraoke(filter);
   insertExcursions(filter);
   updateCount();
  }finally{
   if(observer){observer.observe(grid,{childList:true});}
   applying=false;
  }
 }

 function writeTourParam(id,mode){
  var url=new URL(window.location.href);
  if(id){url.searchParams.set("tour",id);}else{url.searchParams.delete("tour");}
  var next=url.pathname+(url.search||"")+(url.hash||"");
  window.history[mode==="push"?"pushState":"replaceState"]({tour:id||null},"",next);
 }

 function openDetail(id){
  var d=managedDetails[id];
  if(!d){return;}
  var modal=document.getElementById("modal");
  var content=document.getElementById("modalContent");
  if(!modal || !content){return;}
  var route="";
  for(var i=0;i<d.route.length;i++){
   route+="<li><b>"+esc(d.route[i][0])+"</b><span>"+esc(d.route[i][1])+"</span></li>";
  }
  content.innerHTML=
   "<h2>"+esc(d.title)+"</h2>"+
   "<p class=\"lead\">"+esc(d.story)+"</p>"+
   "<div class=\"modal-grid\">"+
    "<div class=\"info\"><small>Длительность</small><b>"+esc(d.duration)+"</b></div>"+
    "<div class=\"info\"><small>Стоимость</small><b>"+esc(d.price)+"</b></div>"+
    "<div class=\"info\"><small>Кому подойдёт</small><b>"+esc(d.forwhom)+"</b></div>"+
    "<div class=\"info\"><small>Формат</small><b>Частная экскурсия</b></div>"+
   "</div>"+
   "<div class=\"detail-section\"><h3>Как проходит маршрут</h3><ul class=\"route-list\">"+route+"</ul></div>"+
   "<div class=\"detail-section\"><h3>Что входит</h3><p>"+esc(d.included)+"</p></div>"+
   "<div class=\"detail-section\"><h3>Дополнительные расходы</h3><p>"+esc(d.extra)+"</p></div>"+
   "<div class=\"detail-section\"><h3>Важно знать</h3><p>"+esc(d.tips)+"</p></div>"+
   "<div class=\"modal-actions\"><button class=\"btn btn-primary\" type=\"button\" data-catalog25-apply=\""+esc(id)+"\">Оставить заявку</button><button class=\"btn btn-secondary\" type=\"button\" data-full-close=\"1\">Закрыть</button></div>";
  modal.classList.add("open");
  document.body.style.overflow="hidden";
  var current=new URL(window.location.href).searchParams.get("tour");
  if(current!==id){writeTourParam(id,"push");}
 }

 function openApply(id){
  var t=null;
  for(var i=0;i<managedTours.length;i++){if(managedTours[i].id===id){t=managedTours[i];break;}}
  if(!t){return;}
  var detailModal=document.getElementById("modal");
  if(detailModal){detailModal.classList.remove("open");}
  if(typeof window.openApply==="function"){window.openApply("");}
  var tourId=document.getElementById("tourId");
  var tourTitle=document.getElementById("tourTitle");
  var tourPrice=document.getElementById("tourPrice");
  var badge=document.getElementById("selectedTourBadge");
  var summary=document.getElementById("summaryTour");
  var summaryPrice=document.getElementById("summaryPrice");
  if(tourId){tourId.value=t.id;}
  if(tourTitle){tourTitle.value=t.title;}
  if(tourPrice){tourPrice.value=t.price;}
  if(badge){badge.textContent=t.title;}
  if(summary){summary.textContent=t.title;}
  if(summaryPrice){summaryPrice.textContent=t.price;}
  writeTourParam(null,"replace");
 }

 document.addEventListener("click",function(event){
  var detail=findAttrTarget(event.target,"data-catalog25-detail");
  if(detail){
   event.preventDefault();
   event.stopPropagation();
   if(event.stopImmediatePropagation){event.stopImmediatePropagation();}
   openDetail(detail.getAttribute("data-catalog25-detail"));
   return;
  }
  var apply=findAttrTarget(event.target,"data-catalog25-apply");
  if(apply){
   event.preventDefault();
   event.stopPropagation();
   if(event.stopImmediatePropagation){event.stopImmediatePropagation();}
   openApply(apply.getAttribute("data-catalog25-apply"));
  }
 },true);

 observer=new MutationObserver(function(){window.setTimeout(patchGrid,0);});
 observer.observe(grid,{childList:true});
 patchGrid();
 window.__samurayCatalog25={patch:patchGrid,tours:managedTours.slice()};
})();
</script>
