<script>
(function(){
  var longDescriptions={
    "3d":`
      <p>Токио невозможно понять по одной открытке. Этот город раскрывается слоями, настроениями, ритмами. На экскурсии «3D Токио» вы не просто увидите несколько известных мест, а буквально проживёте три совершенно разные версии города за одну прогулку.</p>
      <p>Сначала мы погрузимся в духовный Токио - пройдём через тории в лес Мэйдзи Дзингу, где шум мегаполиса растворяется в тишине, хрусте гальки под ногами и запахе дерева. Я расскажу, как император Мэйдзи изменил Японию, что такое синто, почему сюда приходят сами японцы и как в одном месте соединились история, вера и благодарность целой страны.</p>
      <p>Потом мы резко сменим атмосферу и окажемся в молодёжном Токио - ярком, шумном, немного безумном и очень живом. Харадзюку - это мир уличной моды, сладостей, необычных витрин, милых безумств и постоянного ощущения праздника. Здесь город становится дерзким, игривым и совершенно не похожим на тот, что вы видели всего полчаса назад.</p>
      <p>А затем мы выйдем во взрослый Токио. Через стильные улицы и скрытые проходы доберёмся до Сибуи - района энергии, скорости, огней и большого города, который никогда не сбавляет темп. Знаменитый скрамбл, история Хатико, скрытые переулки, неожиданные детали и лучшие точки для фото помогут почувствовать ту самую взрослую, городскую, пульсирующую сторону Токио.</p>
      <p>Это не сухая экскурсия с набором дат и фактов. Это живая прогулка, где город постепенно раскрывается через истории, детали, контрасты, атмосферу и маленькие культурные открытия. Идеально для первых дней в Японии, чтобы не просто посмотреть Токио, а сразу начать его чувствовать.</p>`,

    "asakusa":`
      <p>Асакуса часто выглядит на фотографиях как набор узнаваемых символов: огромный красный фонарь, ворота Каминаримон, торговая улица и башня Skytree на горизонте. Но за этой открыткой скрывается район, через который можно прочитать почти всю историю восточного Токио - от храмового предания и паломников до послевоенного восстановления и современного города у реки.</p>
      <p>Мы пройдём к Сэнсо-дзи не как по сувенирному коридору, а как по живому маршруту, который веками соединял веру, торговлю и городские развлечения. Поговорим о скрытом образе Каннон, о том, почему Накамисэ возникла из договора между храмом и местными жителями, как буддизм и синто веками существовали рядом и почему древность места не всегда равна возрасту его нынешних зданий.</p>
      <p>Затем Асакуса раскроется с другой стороны - через старые развлекательные кварталы, небольшие улицы и реку Сумида, которая когда-то была городской магистралью, а сегодня стала одной из лучших панорамных линий района. На противоположном берегу появятся Asahi и Skytree - уже современная глава той же истории.</p>
      <p>Эта прогулка подходит тем, кто хочет увидеть не музейный «старый Токио», а район, где традиция продолжает работать внутри обычной городской жизни.</p>`,

    "tsukiji":`
      <p>Цукидзи невозможно свести к фразе «рыбный рынок». Оптовые аукционы действительно переехали в Тоёсу, но внешний рынок не исчез. Он сохранил лавки, рестораны, профессиональные продукты, запах даси, работу ножей, сладкий тамагояки и ту плотность вкусов, ради которой сюда по-прежнему приезжают и туристы, и сами токийцы.</p>
      <p>Мы будем не просто пробовать всё подряд, что успело стать вирусным. Я покажу, как выбирать продукт, сравнивать продавцов и понимать, за что вы платите. Поговорим о тунце, суши, даси, сезонности и простых правилах рынка, которые помогают получить удовольствие, не мешая людям работать и не превращая завтрак в соревнование очередей.</p>
      <p>После живого и шумного Цукидзи мы увидим неожиданную архитектуру храма Хонгандзи, а затем перейдём в Гиндзу. Контраст возникает почти мгновенно: вместо рыночных проходов - широкие улицы, витрины, универмаги и квартал, который когда-то задумывался как образ нового, современного Токио.</p>
      <p>Это маршрут о японской еде, но ещё больше - о городе, где рынок, религия и дорогой торговый район существуют рядом и объясняют друг друга.</p>`,

    "akiba":`
      <p>Акихабара стала мировой столицей электроники, аниме и коллекционной культуры не за один день. Её история складывалась слоями: противопожарный пустырь, торговля электрическими материалами, послевоенные радиодетали под путями, домашняя техника, компьютеры, игры, фигурки и бесконечные маленькие миры для людей с очень конкретными увлечениями.</p>
      <p>Мы разберёмся, почему один и тот же герой может стоить две тысячи и двадцать тысяч иен, как читать состояние second hand, зачем люди поворачивают ручку гасяпона и почему случайность сама становится частью покупки. Здесь важно не только смотреть на витрины, но и понимать правила рынка, производителей, ограниченные серии и тонкую границу между находкой и импульсивной тратой.</p>
      <p>После плотной цифровой Акихабары маршрут меняет ритм и выходит к Амэёко - послевоенному рынку дефицита, еды и независимых магазинов под железной дорогой. Контраст показывает, насколько разными могут быть торговые районы, выросшие вокруг соседних станций.</p>
      <p>Это прогулка не только для поклонников аниме. Она для всех, кому интересно, как Токио превращает нишевые интересы, старую инфраструктуру и уличную торговлю в полноценную городскую культуру.</p>`,

    "yanaka":`
      <p>Янака и Нэзу позволяют увидеть Токио без гигантских экранов и обязательного ощущения, что город куда-то опаздывает. Здесь пространство остаётся человеческого масштаба: храмовые стены, небольшие дома, мастерские, торговая улица, тихие переулки и действующее кладбище существуют рядом с обычной жизнью района.</p>
      <p>Но это не застывший кусок эпохи Эдо. Старые здания меняли функции, улицы восстанавливались, магазины приспосабливались к туристам, а район постоянно искал способ сохранить характер без превращения в декорацию. Мы поговорим о том, почему Янака пережила изменения иначе, чем центр, и как соседская торговля стала важнее идеальной музейной картинки.</p>
      <p>В Нэзу нас ждёт один из редких хорошо сохранившихся храмовых ансамблей начала XVIII века, красный коридор торий Отомэ Инари и сад, который весной меняется вместе с азалиями. Здесь особенно хорошо видно, как религиозное пространство остаётся частью живого города.</p>
      <p>Прогулка подойдёт тем, кто любит детали, спокойный темп и Токио, который не требует постоянно смотреть вверх.</p>`,

    "architecture":`
      <p>Центр Токио кажется строгим и дорогим, но его архитектура гораздо интереснее простого набора красивых фасадов. Гиндза, Маруноути и район Tokyo Station показывают, как Япония училась быть современной, переживала пожары, землетрясения и войну, а затем снова собирала образ столицы из кирпича, камня, стекла и железнодорожной инфраструктуры.</p>
      <p>В Гиндзе мы увидим квартал-витрину, где широкие улицы и необычные здания работают почти как выставка архитектурных идей. Дальше Маруноути покажет другой масштаб - деловой центр между вокзалом и бывшим замком Эдо, где исторические здания встроены в небоскрёбы, а город постоянно договаривается между сохранением и новой экономикой.</p>
      <p>Финал у Tokyo Station и императорского центра связывает архитектуру с политической географией. Краснокирпичный вокзал, проспект Гёко-дори и свободное пространство перед дворцом помогают понять, почему сердце столицы устроено именно так.</p>
      <p>Это прогулка для тех, кто любит не только фотографировать здания, но и читать по ним историю города.</p>`,

    "gardens":`
      <p>В Токио сад редко существует отдельно от города. За деревьями могут подниматься офисные башни, по соседству проходит железная дорога, а пруд хранит память о море, охоте сёгунов или старой усадьбе. Именно этот контраст делает токийские сады особенно сильными.</p>
      <p>Мы пройдём через несколько зелёных пространств с разным характером. В одном важны вода, приливный пруд и чайный домик, в другом - компактная композиция и виды на современный район, в третьем - связь с императорской или даймёской историей. Я покажу, как японский прогулочный сад управляет движением, скрывает и открывает пейзаж, создаёт паузы и превращает небольшой участок в последовательность сцен.</p>
      <p>Маршрут не требует ботанических знаний и не превращается в лекцию о каждом кусте. Он помогает почувствовать, как в Японии природу не просто сохраняют, а проектируют как опыт, который меняется со светом, погодой и временем года.</p>
      <p>Подходит тем, кто хочет отдохнуть от плотного города, не покидая самого Токио.</p>`,

    "depachika":`
      <p>Подвал японского универмага может оказаться насыщеннее целого гастрономического квартала. Здесь рядом стоят бэнто, вагаси, региональные продукты, дорогие фрукты, повседневные блюда, подарочные коробки и временные ярмарки, которые каждую неделю заново собирают карту Японии.</p>
      <p>Мы посетим два больших универмага Нихомбаси и сравним не только еду, но и саму логику японской торговли. Почему упаковка считается частью подарка? Чем отличаются две похожие даты срока годности? Как выбрать омиягэ, который переживёт перелёт? Почему универмаг продаёт доверие вместе с продуктом и когда дорогая коробка действительно имеет смысл?</p>
      <p>Дегустация строится не вокруг одного дорогого обеда, а вокруг небольших категорий и осознанного выбора. Можно попробовать больше, увидеть сезонные витрины и при этом не купить первую красивую коробку, обладающую тремя слоями картона и безупречным чувством собственного достоинства.</p>
      <p>Это экскурсия для тех, кто хочет понять японскую еду через культуру выбора, сервиса и подарка.</p>`,

    "hanami":`
      <p>Сакура не читает расписание экскурсий и не подписывает договор о полном цветении. Поэтому хороший ханами-тур строится не на обещании идеальной открытки, а на внимательной проверке реального состояния деревьев, погоды, ветра и человеческого потока.</p>
      <p>Основой маршрута становятся Чидоригафути и Китаномару - территория бывшего замка Эдо, где весенний пейзаж соединяется с историей города, водой, воротами и современной культурой ханами. Мы поговорим о том, почему Somei-yoshino цветут почти одновременно, как одно эталонное дерево объявляет начало сезона всему Токио и почему официальный прогноз всё равно не описывает каждый парк.</p>
      <p>Порядок точек и финальная стартовая локация подтверждаются по живой ситуации. Иногда главным становится ров и отражения, иногда более спокойная аллея, раннее цветение или поздняя редакция сезона. Лодка и подсветка остаются приятной возможностью, а не обещанием, которое дождь может отменить за пять минут.</p>
      <p>Это прогулка о красоте короткого момента и о том, как увидеть его честно, без туристической магии календаря.</p>`,

    "momiji":`
      <p>Осенний Токио меняется медленнее сакуры и никогда не красится одним цветом одновременно. В одном саду клёны уже горят красным, в другом гинкго только становится золотым, а третий участок всё ещё выглядит почти летним. Поэтому Момидзи Экспресс сравнивает два сада и работает с реальным состоянием сезона.</p>
      <p>Коисикава Коракуэн раскрывает пейзаж через китайские и японские культурные цитаты, воду, мосты и старую идею сада даймё как уменьшенной карты мира. Рикугиэн построен вокруг поэзии вака и последовательности скрытых видов. Вместе они показывают два разных способа превращать природу в маршрут.</p>
      <p>Мы поговорим о том, почему момидзигари называют охотой за листьями, как температура, свет и вид дерева влияют на окраску и почему прошлогодняя дата пика не является договором с нынешней осенью. Порядок остановок и время в каждом саду меняются по фактической красоте дня.</p>
      <p>Это спокойная сезонная прогулка для тех, кто предпочитает наблюдать, сравнивать и не бежать за единственным «правильным» красным деревом.</p>`,

    "shinjuku":`
      <p>Ночной Синдзюку легко принять за море вывесок, игровых залов и случайных переулков. Но у этого хаоса есть история и структура. Запад района вырос как спланированный деловой центр, восток сохранил торговую и развлекательную энергию, а между ними находится одна из самых сложных станций мира.</p>
      <p>Мы пройдём от послевоенного человеческого масштаба Омоидэ Ёкочо к Кабуки-тё, которое назвали в честь театра, так и не построенного по первоначальному плану. Увидим Годзиллу, вертикальные вывески, скрытые этажи и поговорим о том, как безопасно читать ночной район, выбирать заведения и не следовать за уличными зазывалами.</p>
      <p>Финал в Голден Гае раскрывает другой Токио - сотни маленьких баров, лестниц и микросообществ, где характер места определяется не размером помещения, а хозяином, музыкой, постоянными гостями и правилами конкретной двери.</p>
      <p>Это не поход по сомнительным заведениям и не лекция о криминале. Это живая вечерняя прогулка, после которой Синдзюку перестаёт быть просто неоном и становится понятным городом внутри города.</p>`,

    "classic":`
      <p>Классический Токио за день нужен не для того, чтобы поставить рекорд по количеству станций. Его задача - собрать первые впечатления в понятную историю: от императорской и религиозной Японии к молодёжным районам, деловому центру и старому востоку города.</p>
      <p>В течение дня меняются не только точки, но и масштабы. Тихое святилище помогает поговорить о синто и модернизации страны, Харадзюку и Сибуя показывают современную культуру, Маруноути и территория бывшего замка Эдо объясняют устройство столицы, а Асакуса возвращает к храму, торговле и старым городским развлечениям.</p>
      <p>Маршрут гибкий: порядок зависит от места проживания, дня недели, погоды и интересов группы. Мы не пытаемся увидеть «всё», потому что Токио подобное высокомерие обычно наказывает пересадками. Вместо этого вы получаете прочный каркас города и понимаете, куда захотите вернуться самостоятельно.</p>
      <p>Лучший выбор для первого полноценного дня и для тех, кому нужен широкий, но не поверхностный обзор.</p>`,

    "contrast":`
      <p>Современность и традиционность в Токио не живут в разных музеях. Они соседствуют на одной линии метро, в одном квартале и иногда в одном здании. Этот маршрут строится именно на таких столкновениях: святилище и уличная мода, старый храм и новая башня, императорский центр и стеклянные деловые кварталы.</p>
      <p>Мы начнём с пространства, где ритуал, лес и память о модернизации Японии создают ощущение тишины внутри мегаполиса. Затем город станет ярче и быстрее - молодёжные улицы, Сибуя, архитектура и плотный поток покажут современную сторону Токио. Во второй части дня традиционный восток соединится с новыми панорамами и городской инфраструктурой.</p>
      <p>Важен не список достопримечательностей, а постоянная смена перспективы. Вы увидите, что Япония не выбирала между старым и новым раз и навсегда. Она снова и снова перестраивает их отношения, иногда бережно, иногда дерзко, а иногда с торговым центром прямо над исторической памятью.</p>
      <p>Маршрут подходит тем, кто хочет понять главный токийский парадокс за один насыщенный день.</p>`,

    "temples":`
      <p>Этот день соединяет религию, сады и старые кварталы без гонки между главными фототочками. Мы начинаем в Асакусе, где буддийский храм, синтоистское святилище, торговая улица и районная жизнь веками существовали как единая городская система.</p>
      <p>Дальше вода и сад меняют ритм маршрута. По возможности мы используем речной переход к Хамарикю, чтобы увидеть Токио с той стороны, с которой он исторически снабжался и развивался. В саду поговорим о сёгунах, приливном пруде, чайном домике и о том, как спроектированная природа работает рядом с небоскрёбами.</p>
      <p>Во второй половине дня Нэзу и Янака показывают более тихую религиозную и жилую ткань города: хорошо сохранившееся святилище, тории, храмовые улицы, кладбище и местную торговлю. Если корабль отменён, смысл дня сохраняется сухопутной редакцией.</p>
      <p>Подходит тем, кому важнее атмосфера, история и содержательный разговор, чем максимальное число знаменитых названий.</p>`,

    "culinary":`
      <p>Кулинарный Токио - это не один рынок и не бесконечная очередь за суши. За день мы увидим несколько разных систем еды: профессиональную торговлю Цукидзи, сезонные витрины Гиндзы, подземную гастрономию универмагов и более повседневные районы с собственным ритмом.</p>
      <p>На Цукидзи разберёмся с продуктами, даси, тунцом, тамагояки и правилами выбора. В депачика увидим, как еда превращается в подарок, региональную карту и сезонный календарь. Дальше маршрут меняет характер: Акихабара или другой выбранный район покажет более массовую, игровую и повседневную сторону городской гастрономии.</p>
      <p>Мы не включаем еду в фиксированную стоимость, потому что аппетит, ограничения и бюджет у людей устроены подозрительно индивидуально. Я помогу выбирать, переводить, заказывать и понимать блюдо, а вы сами решаете, насколько далеко хотите зайти в дегустации.</p>
      <p>Это день для тех, кто хочет не просто поесть в Японии, а научиться читать её вкусы и места.</p>`,

    "nightfull":`
      <p>Ночной Токио лучше понимать не с первой неоновой вывески, а с момента, когда дневной город начинает менять правила. Поэтому этот маршрут стартует позже обычного и специально захватывает переход от спокойных районов и закатных панорам к вечерней плотности Сибуи, Одайбы или Синдзюку.</p>
      <p>Дневной блок выбирается под интересы группы: традиционный центр, залив, современная архитектура или другой контрастный район. На закате появляются вода, отражения, панорамы и первые огни. После темноты город раскрывается через станции, переулки, вертикальные заведения, маленькие бары и районы, которые днём выглядят почти обычными.</p>
      <p>Это не обязательный барный тур. Алкоголь, караоке и платные смотровые остаются вариантами, а не условием участия. Главная идея - прожить смену Токио в течение одного длинного дня и увидеть, как освещение, поток людей и время суток полностью меняют знакомое пространство.</p>
      <p>Маршрут активный и рассчитан на гостей, которым хочется максимального контраста без раннего утра.</p>`,

    "express":`
      <p>Увидеть весь Токио за день невозможно. Зато можно перестать воспринимать его как набор случайных станций. Токио Экспресс собирает несколько контрастных районов в понятную географическую и историческую карту.</p>
      <p>Мы последовательно проходим традиционный, центральный и современный блоки. Храм или святилище дают культурную основу, Маруноути и бывший замок Эдо объясняют устройство столицы, а Харадзюку, Сибуя или другой современный район показывают сегодняшнюю энергию города. Между ними важны не только остановки, но и переходы, линии поездов и изменение городской ткани.</p>
      <p>Темп выше, чем у обычного полного дня, однако маршрут не превращается в спортивное ориентирование с гидом. Я сокращаю длинные паузы, заранее оптимизирую логистику и оставляю достаточно времени, чтобы каждая часть города успела приобрести смысл.</p>
      <p>Подходит тем, у кого один полноценный день и желание получить рабочую карту Токио, а не коллекцию фотографий без связи между ними.</p>`,

    "family":`
      <p>Семейный маршрут строится не по принципу «взрослые выбрали достопримечательности, дети должны терпеть». Мы чередуем движение, яркие истории, еду, животных, открытые пространства и места, где ребёнку действительно есть что делать.</p>
      <p>День может начаться в Уэно или другой подходящей семейной локации, затем перейти к Асакусе с храмом, уличной едой и понятными визуальными сюжетами, а завершиться у Skytree и современного восточного Токио. Конкретный набор зависит от возраста детей, их интересов, погоды и того, сколько энергии семья готова разумно потратить.</p>
      <p>Паузы и сокращения здесь не считаются провалом программы. Наоборот, хороший семейный день сохраняет любопытство до вечера и не заставляет всех ненавидеть Японию к обеду. В дождь или жару открытые блоки заменяются крытыми вариантами.</p>
      <p>Это полноценная экскурсия для всей семьи, а не детская анимация и не взрослая гонка, к которой случайно приложили детей.</p>`,

    "imperial":`
      <p>Чтобы понять современный Токио, полезно начать с пространства, где когда-то находился замок Эдо. Рвы, ворота, сады и огромные свободные площади вокруг Императорского дворца объясняют политическую географию города лучше любой схемы.</p>
      <p>Мы подробнее, чем в обычном обзорном маршруте, разбираем устройство бывшего замка, переход от сёгуната к императорской столице и развитие Маруноути. Tokyo Station показывает, как железная дорога, государство и деловой центр сформировали современное лицо района, а восстановленная архитектура связывает довоенный и сегодняшний город.</p>
      <p>Во второй половине дня маршрут уходит от официального центра к Янаке и Нэзу. Старые жилые улицы, местная торговля и святилище создают человеческий контраст императорским площадям и офисным башням.</p>
      <p>Этот день подходит тем, кому особенно интересны история власти, городское устройство и более спокойная версия классического знакомства с Токио.</p>`,

    "odaiba":`
      <p>Одайба выглядит как отдельный город, вынесенный в Токийский залив. Здесь больше неба, воды и свободного пространства, чем в центральных районах, а линия горизонта соединяет Rainbow Bridge, порт, футуристические здания и искусственные острова.</p>
      <p>Маршрут начинается с истории залива и того, как оборонительные сооружения и насыпные территории постепенно превратились в район выставок, торговли, технологий и развлечений. Мы поговорим о транспортной системе, архитектуре и о том, почему пространство Одайбы ощущается совсем иначе, чем улицы Сибуи или Асакусы.</p>
      <p>Конкретная программа зависит от состава группы. Можно сделать акцент на технологиях, музеях, семейных активностях, шопинге, береговой прогулке или вечерних панорамах. Платные объекты выбираются заранее, чтобы день не распался на очереди и случайные билеты.</p>
      <p>Лучший вариант для семей, повторного визита и всех, кому хочется увидеть Токио со стороны воды и будущего.</p>`,

    "season-express":`
      <p>Сезонный Tokyo Express создан для тех случаев, когда в городе происходит что-то достойное отдельной прогулки, но полный день не нужен. Это может быть цветение, осенняя окраска, летний вечер, зимняя подсветка, временное событие или другой короткий период, который невозможно честно закрепить одним вечным маршрутом.</p>
      <p>После заявки определяется лучший район и тема по цветению, событию, погоде и времени суток. Затем я собираю компактную трёхчасовую редакцию в одном районе, чтобы прогулка сохраняла смысл и не превращалась в поездки через весь город ради трёх сезонных фотографий.</p>
      <p>Сакура и красные клёны остаются отдельными специализированными продуктами - Ханами Экспресс и Момидзи Экспресс. Общий сезонный формат охватывает остальные темы года и всегда включает содержательный план Б на случай жары, дождя, ветра или временных ограничений.</p>
      <p>Это не лотерея «куда-нибудь сводят». Это заранее подготовленная прогулка, которая меняется вместе с реальным Токио.</p>`,

    "season-special":`
      <p>Сезонный Tokyo Special - полный день, который строится не вокруг одного списка точек, а вокруг лучшей темы конкретного месяца и ваших дат. Природа, праздники, выставки, сезонная еда и вечерний свет меняются быстрее, чем успевают устаревать стандартные программы.</p>
      <p>После заявки определяется тема месяца и несколько подходящих вариантов. За 7-10 дней, а затем за 24-48 часов я проверяю фактическое состояние природы, события, билеты, погоду, закрытия и транспорт. Только после этого формируется окончательная редакция дня.</p>
      <p>Полный формат позволяет соединить несколько районов, добавить паузы, сезонный обед или вечерний блок и при этом иметь содержательный резерв. Если один элемент исчезает из-за погоды или организации, маршрут не теряет тему целиком.</p>
      <p>Это продукт для повторного визита и для гостей, которые хотят увидеть Токио не вообще, а именно таким, каким он существует в их конкретные даты.</p>`,

    "karaoke":`
      <p>Караоке в Японии - это не сцена перед незнакомой публикой и не проверка вокальных способностей. Это приватное социальное пространство, где компания выбирает музыку, заказывает напитки, меняется микрофонами и постепенно перестаёт вести себя так официально, как на улице.</p>
      <p>За вечер мы попробуем несколько форматов: современную комнату в Сибуе, классическую японскую сеть и небольшой караоке-бар в Голден Гае. Я помогу разобраться с пультом, каталогом песен, системой оплаты и правилами каждого места, а заодно расскажу, как «пустой оркестр» превратился в одну из самых узнаваемых частей японской ночной культуры.</p>
      <p>Главное правило тура - можно не петь. Можно подпевать, выбирать музыку, слушать других или просто наблюдать. Алкоголь и съёмка тоже полностью добровольны. Формат должен помогать человеку расслабиться, а не превращать микрофон в инструмент социального давления.</p>
      <p>Подходит соло-гостям, парам и компаниям, которые хотят прожить настоящий токийский вечер без клуба и обязательного таланта.</p>`,

    "kawaguchiko":`
      <p>Фудзи нельзя включить в стоимость как гарантированный вид. Облака, ветер и сезон не читают программу экскурсии. Поэтому поездка к Кавагучико строится не как охота за одной обязательной фотографией, а как полноценный день у озера, который сохраняет смысл даже при капризной видимости.</p>
      <p>Мы выбираем лучшие точки по погоде, свету и транспорту, гуляем у воды и оставляем время на тишину, а не только на новый пункт списка. В ясную погоду маршрут работает с панорамой Фудзи и отражениями. В облачную редакцию входят природа, местная культура, святилище, музей, восстановленная деревня или другие точки, которые не требуют идеального горизонта.</p>
      <p>Отдельно решается транспортная модель. Поезд даёт предсказуемый каркас и северный берег, автомобиль добавляет гибкость и доступ к более удалённым местам, но зависит от пробок. Я заранее объясняю различия и собираю день под приоритеты группы.</p>
      <p>Это выезд в тихую Японию, где пауза у воды иногда важнее количества достопримечательностей.</p>`,

    "kamakura":`
      <p>Камакура находится недалеко от Токио, но ощущается как другой исторический мир. Здесь бывшая столица воинов соединяет буддийские храмы, синтоистское святилище, старые дороги, современный город и океан.</p>
      <p>Мы увидим Великого Будду не как отдельную знаменитую статую, а как часть религиозной и политической истории Камакуры. В Хасэдэра поговорим о Каннон, садах и видах на побережье. Затем маршрут выйдет к Юигахаме, где море создаёт необходимую паузу между храмовыми блоками и центральными улицами.</p>
      <p>Во второй части дня Цуругаока Хатимангу раскрывает связь города с воинской властью и культурой самураев, а Комати-дори возвращает нас в живую современную Камакуру с магазинами, едой и туристическим потоком. Порядок точек адаптируется под сезон, погоду и загруженность поездов.</p>
      <p>Это день для тех, кто хочет выйти за пределы Токио и увидеть, как история, религия и повседневная жизнь продолжают существовать в одном городе у океана.</p>`
  };

  function injectLongDescription(id){
    var root=document.getElementById("modalContent");
    var html=longDescriptions[id];
    if(!root||!html||root.querySelector(".tour-long-description")){return;}
    var lead=root.querySelector(".lead");
    if(!lead){return;}
    var block=document.createElement("details");
    block.className="tour-long-description";
    block.innerHTML='<summary>Подробное описание</summary><div class="tour-long-description__body">'+html+'</div>';
    lead.insertAdjacentElement("afterend",block);
  }

  var previousOpenTour=window.openTour;
  if(typeof previousOpenTour==="function"){
    window.openTour=function(id){
      var result=previousOpenTour.apply(this,arguments);
      setTimeout(function(){injectLongDescription(id);},0);
      return result;
    };
  }

  window.addEventListener("click",function(event){
    var button=event.target.closest&&event.target.closest("[data-fallback-detail]");
    if(!button){return;}
    var id=button.getAttribute("data-fallback-detail");
    setTimeout(function(){injectLongDescription(id);},0);
  },true);

  function syncFromUrl(){
    var id=new URL(window.location.href).searchParams.get("tour");
    if(id){setTimeout(function(){injectLongDescription(id);},0);}
  }

  window.addEventListener("popstate",syncFromUrl);
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",syncFromUrl,{once:true});
  }else{
    syncFromUrl();
  }
})();
</script>
