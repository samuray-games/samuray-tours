<script>
(function(){
 var endpoint="https://script.google.com/macros/s/AKfycbztCYRPUfjdHesTP0hDl9WEwP_Uapj31sLkYH8mO89qvREswQ_5n5Ccv8rP2he66bPiHA/exec";
 var tourMap={
  "3d":["3D Токио","13 900 ₽"],
  "asakusa":["Асакуса: из Эдо в Токио","12 900 ₽"],
  "tsukiji":["Цукидзи + Гиндза","14 900 ₽"],
  "akiba":["Акихабара + Амэёко","13 900 ₽"],
  "yanaka":["Янака + Нэзу","13 900 ₽"],
  "architecture":["Архитектурный центр Токио","13 900 ₽"],
  "gardens":["Сады города","14 900 ₽"],
  "depachika":["Депачика: гастрономический лабиринт","12 900 ₽"],
  "season":["Сакура / Момидзи","23 900 ₽"],
  "shinjuku":["Синдзюку: неон и Голден Гай","15 900 ₽"],
  "classic":["Классический Токио за день","19 900 ₽"],
  "contrast":["Современность & традиционность","23 900 ₽"],
  "temples":["Сады и храмы Токио","23 900 ₽"],
  "culinary":["Кулинарный Токио","25 900 ₽"],
  "nightfull":["Ночной Токио","27 900 ₽"],
  "express":["Токио Экспресс","24 900 ₽"],
  "family":["Токио для семей с детьми","23 900 ₽"],
  "imperial":["Классика + Императорские сады","23 900 ₽"],
  "odaiba":["Одайба и Токийский залив","23 900 ₽"]
 };
 var applyFormTemplate=null;

 function esc(value){
  return String(value||"").replace(/[&<>\"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];});
 }

 function findAttrTarget(start,attr){
  var node=start;
  while(node && node!==document){
   if(node.getAttribute && node.getAttribute(attr)!==null){return node;}
   node=node.parentNode;
  }
  return null;
 }

 function getApplyFormWrap(){
  return document.getElementById("applyFormWrap");
 }

 function getApplyForm(){
  return document.getElementById("tourApplication");
 }

 function captureApplyTemplate(){
  if(applyFormTemplate!==null){return;}
  var wrap=getApplyFormWrap();
  if(wrap){applyFormTemplate=wrap.innerHTML;}
 }

 function restoreApplyForm(){
  var wrap=getApplyFormWrap();
  if(!wrap){return null;}
  captureApplyTemplate();
  if(applyFormTemplate!==null){wrap.innerHTML=applyFormTemplate;}
  return wrap;
 }

 function bindApplyForm(){
  var form=getApplyForm();
  if(form){
   form.onsubmit=function(event){
    submitDirectApplication(event);
    return false;
   };
  }
  var children=document.getElementById("children");
  if(children && !children.getAttribute("data-bound")){
   children.setAttribute("data-bound","1");
   children.onchange=function(e){
    var field=document.getElementById("childrenAgesField");
    if(field){field.style.display=e && e.target && e.target.value==="0" ? "none" : "flex";}
   };
  }
 }

 function setSelectedTourFields(t){
  var tourId=document.getElementById("tourId");
  var tourTitle=document.getElementById("tourTitle");
  var tourPrice=document.getElementById("tourPrice");
  var badge=document.getElementById("selectedTourBadge");
  var summary=document.getElementById("summaryTour");
  var summaryPrice=document.getElementById("summaryPrice");
  if(tourId){tourId.value=t?t[0]:"";}
  if(tourTitle){tourTitle.value=t?t[0]:"Нужна помощь с выбором тура";}
  if(tourPrice){tourPrice.value=t?t[1]:"";}
  if(badge){badge.textContent=t?t[0]:"Общая заявка";}
  if(summary){summary.textContent=t?t[0]:"Помогу подобрать маршрут";}
  if(summaryPrice){summaryPrice.textContent=t?t[1]:"После выбора маршрута";}
 }

 function resetApplicationFields(t){
  var form=getApplyForm();
  var btn=document.getElementById("submitBtn");
  var status=document.getElementById("formStatus");
  var childrenAgesField=document.getElementById("childrenAgesField");
  if(!form){return;}
  form.reset();
  setSelectedTourFields(t);
  if(childrenAgesField){childrenAgesField.style.display="none";}
  var children=document.getElementById("children");
  if(children){children.value="0";}
  if(btn){btn.disabled=false;btn.textContent="Отправить заявку";}
  if(status){status.textContent="Заявка ни к чему не обязывает. Сначала подтверждаем дату.";status.style.color="";}
}

 function openApplicationState(id){
  var t=id && tourMap[id] ? tourMap[id] : null;
  var modal=document.getElementById("applyModal");
  if(!modal){return;}
  restoreApplyForm();
  bindApplyForm();
  resetApplicationFields(t);
  var status=document.getElementById("formStatus");
  if(status){status.innerHTML="Заявка ни к чему не обязывает. Сначала подтверждаем дату.";status.style.color="";}
  modal.scrollTop=0;
  modal.classList.add("open");
  document.body.style.overflow="hidden";
 }

 function openApplication(id){
  openApplicationState(id);
 }

 function collectForm(form){
  var data={};
  var fd=new FormData(form);
  fd.forEach(function(value,key){
   if(key!=="interests"){data[key]=value;}
  });
  data.interests=[];
  var checks=form.querySelectorAll('input[name="interests"]:checked');
  for(var i=0;i<checks.length;i++){data.interests.push(checks[i].value);}
  data.pageUrl=location.href;
  data.submittedAt=new Date().toISOString();
  if(!data.tourTitle || data.tourTitle==="Не выбрано"){
   data.tourTitle="Нужна помощь с выбором тура";
  }
  return data;
 }

 function renderSuccessBox(data, result){
  var wrap=getApplyFormWrap();
  if(!wrap){return;}
  var notionUrl=result && result.notion && result.notion.url ? result.notion.url : "";
  var calendarUrl=result && result.calendar && result.calendar.url ? result.calendar.url : "";
  var calendarTitle=result && result.calendar && result.calendar.title ? result.calendar.title : "Недоступно";
  wrap.innerHTML=
   "<div class=\"success-box\">"+
    "<div class=\"kicker\">Заявка отправлена</div>"+
    "<h2>Спасибо, "+esc(data.name)+".</h2>"+
    "<p>Заявка на «"+esc(data.tourTitle)+"» сохранена. Я проверю дату и свяжусь с вами по указанному контакту. Бронирование считается подтверждённым только после моего ответа.</p>"+
    "<div class=\"success-meta\">"+
     "<div><small>CRM Notion</small>"+(notionUrl ? "<a href=\""+esc(notionUrl)+"\" target=\"_blank\" rel=\"noopener\">Открыть карточку</a>" : "<span>Недоступно</span>")+"</div>"+
     "<div><small>Календарь</small>"+(calendarUrl ? "<a href=\""+esc(calendarUrl)+"\" target=\"_blank\" rel=\"noopener\">"+esc(calendarTitle)+"</a>" : "<span>Недоступно</span>")+"</div>"+
    "</div>"+
    "<button class=\"btn btn-primary\" type=\"button\" data-direct-close=\"1\">Вернуться к экскурсиям</button>"+
   "</div>";
 }

 async function submitDirectApplication(event){
  if(event){event.preventDefault();}
  var form=event && event.target ? event.target : document.getElementById("tourApplication");
  if(!form){return false;}

  var btn=document.getElementById("submitBtn");
  var status=document.getElementById("formStatus");
  var data=collectForm(form);

  if(btn){btn.disabled=true;btn.textContent="Отправляю...";}
  if(status){status.textContent="Отправляю заявку...";status.style.color="";}

  try{
   var response=await fetch(endpoint,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data),
    redirect:"follow"
   });
   var result=await response.json();
   if(!result || !result.ok){throw new Error(result && result.error ? result.error : "Не удалось отправить заявку");}
   renderSuccessBox(data, result);
  }catch(error){
   if(status){
    status.innerHTML="Не удалось отправить автоматически. Проверьте связь и попробуйте ещё раз. Если ошибка повторится, напишите Райхану в Telegram: <a href=\"https://t.me/samuray_han\" target=\"_blank\" rel=\"noopener\">@samuray_han</a>.";
    status.style.color="#a3212a";
   }
   if(btn){btn.disabled=false;btn.textContent="Отправить заявку";}
  }
  return false;
 }

 function runApplicationRegression(){
  var report={ok:true,steps:[]};
  try{
   openApplicationState("3d");
   var name=document.getElementById("name");
   var date=document.getElementById("date");
   var contact=document.getElementById("contact");
   if(name){name.value="Regression Test";}
   if(date){date.value="2026-09-30";}
   if(contact){contact.value="@regression";}
   renderSuccessBox({name:"Regression Test",tourTitle:"3D Токио"},{notion:{url:"https://example.com/notion"},calendar:{url:"https://example.com/calendar",title:"Заявка"}});
   report.steps.push(document.querySelector(".success-box") ? "success-visible" : "success-missing");
   var closeBtn=document.querySelector("[data-direct-close]");
   if(closeBtn){closeBtn.click();}
   openApplicationState("asakusa");
   report.steps.push(getApplyForm() ? "form-restored" : "form-missing");
   report.steps.push(document.getElementById("tourTitle") && document.getElementById("tourTitle").value==="Асакуса: из Эдо в Токио" ? "tour-reset" : "tour-not-reset");
   report.steps.push(document.getElementById("name") && !document.getElementById("name").value ? "name-cleared" : "name-not-cleared");
   report.steps.push(document.getElementById("submitBtn") && !document.getElementById("submitBtn").disabled ? "submit-enabled" : "submit-disabled");
  }catch(err){
   report.ok=false;
   report.error=String(err && err.message ? err.message : err);
  }
  return report;
 }

 window.openApply=openApplication;
 window.submitApplication=submitDirectApplication;
 window.__samurayToursRunApplicationRegression=runApplicationRegression;
 window.__samurayToursResetApplicationForm=function(id){openApplicationState(id || ""); return true;};

 document.addEventListener("click",function(event){
  var fallbackApply=findAttrTarget(event.target,"data-fallback-apply");
  if(fallbackApply){
   event.preventDefault();
   event.stopPropagation();
   if(event.stopImmediatePropagation){event.stopImmediatePropagation();}
   openApplication(fallbackApply.getAttribute("data-fallback-apply"));
   return;
  }

  var directClose=findAttrTarget(event.target,"data-direct-close");
  if(directClose){
   event.preventDefault();
   var modal=document.getElementById("applyModal");
   if(modal){modal.classList.remove("open");}
   document.body.style.overflow="";
  }
 },true);

 var form=document.getElementById("tourApplication");
 if(form){
  form.addEventListener("submit",function(event){
   event.preventDefault();
   event.stopPropagation();
   if(event.stopImmediatePropagation){event.stopImmediatePropagation();}
   submitDirectApplication(event);
  },true);
 }

 captureApplyTemplate();
 bindApplyForm();
})();
</script>
